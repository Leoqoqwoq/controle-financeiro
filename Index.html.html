<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro-Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #05060f;
    --nebula-1: #2a1a5e;
    --nebula-2: #0d2f52;
    --nebula-3: #3a1440;
    --panel: rgba(255,255,255,0.055);
    --panel-strong: rgba(10,12,26,0.6);
    --panel-border: rgba(255,255,255,0.10);
    --ink: #EEF0F9;
    --ink-soft: #9AA3C7;
    --ink-faint: #6B7396;
    --receita: #4FE3A6;
    --receita-bg: rgba(79,227,166,0.14);
    --despesa: #FF7A7A;
    --despesa-bg: rgba(255,122,122,0.14);
    --gold: #F4C567;
    --gold-soft: rgba(244,197,103,0.22);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg-deep);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding: 36px 16px 90px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- Fundo espacial ---------- */
  .cosmos{
    position:fixed;
    inset:0;
    z-index:-3;
    background:var(--bg-deep);
    overflow:hidden;
  }
  .nebulosa{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.55;
    will-change:transform;
  }
  .nebulosa.n1{
    width:60vw; height:60vw; max-width:700px; max-height:700px;
    background:radial-gradient(circle, var(--nebula-1), transparent 70%);
    top:-15%; left:-10%;
    animation: derivar1 38s ease-in-out infinite alternate;
  }
  .nebulosa.n2{
    width:50vw; height:50vw; max-width:600px; max-height:600px;
    background:radial-gradient(circle, var(--nebula-2), transparent 70%);
    bottom:-20%; right:-10%;
    animation: derivar2 46s ease-in-out infinite alternate;
  }
  .nebulosa.n3{
    width:40vw; height:40vw; max-width:480px; max-height:480px;
    background:radial-gradient(circle, var(--nebula-3), transparent 70%);
    top:30%; right:15%;
    animation: derivar3 52s ease-in-out infinite alternate;
  }
  @keyframes derivar1{ from{transform:translate(0,0);} to{transform:translate(6vw,8vh);} }
  @keyframes derivar2{ from{transform:translate(0,0);} to{transform:translate(-7vw,-6vh);} }
  @keyframes derivar3{ from{transform:translate(0,0) scale(1);} to{transform:translate(-4vw,5vh) scale(1.12);} }

  .estrelas{ position:absolute; inset:0; }
  .camada-estrela{
    position:absolute; inset:0;
    background-repeat:no-repeat;
  }
  .camada-estrela.perto{ animation: cintilar 3.2s ease-in-out infinite alternate, deslizar 90s linear infinite; }
  .camada-estrela.meio{ animation: cintilar 4.5s ease-in-out infinite alternate-reverse, deslizar 140s linear infinite; opacity:0.8; }
  .camada-estrela.longe{ animation: cintilar 6s ease-in-out infinite alternate, deslizar 220s linear infinite; opacity:0.55; }
  @keyframes cintilar{ from{opacity:0.35;} to{opacity:1;} }
  @keyframes deslizar{ from{transform:translateY(0);} to{transform:translateY(-120px);} }

  .estrela-cadente{
    position:absolute;
    width:2px; height:2px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 6px 1px rgba(255,255,255,0.8);
    opacity:0;
  }
  .estrela-cadente.ativa{
    animation: cair 1.1s ease-out forwards;
  }
  @keyframes cair{
    0%{ opacity:0; transform:translate(0,0) scale(0.6); }
    8%{ opacity:1; }
    100%{ opacity:0; transform:translate(-260px,260px) scale(1); }
  }
  .estrela-cadente.ativa::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width:130px; height:1.5px;
    background:linear-gradient(90deg, rgba(255,255,255,0.9), transparent);
    transform-origin:left center;
    transform:rotate(135deg);
  }

  .wrap{max-width:660px; margin:0 auto; position:relative; z-index:1;}

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom:16px;
    margin-bottom:26px;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  header h1 .pingo{ color:var(--gold); }
  header .data{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-align:right;
    line-height:1.5;
  }

  /* ---------- Navegador de mes ---------- */
  .mes-nav{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
  }
  .mes-seta{
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--ink-soft);
    width:30px; height:30px;
    border-radius:8px;
    cursor:pointer;
    font-size:1rem;
    display:flex; align-items:center; justify-content:center;
    transition: all 0.15s ease;
    flex-shrink:0;
  }
  .mes-seta:hover{ color:var(--ink); border-color:var(--gold); }
  .mes-seta:disabled{ opacity:0.3; cursor:default; }
  .mes-seta:disabled:hover{ color:var(--ink-soft); border-color:var(--panel-border); }
  .mes-label{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:1.05rem;
    color:#000;
    text-transform:capitalize;
    flex:1;
    text-align:center;
    background:var(--gold);
    padding:4px 12px;
    border-radius:8px;
  }
  .mes-todos{
    background:none;
    border:1px solid var(--panel-border);
    color:var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size:0.76rem;
    font-weight:600;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    transition: all 0.15s ease;
    flex-shrink:0;
  }
  .mes-todos:hover{ color:var(--ink); }
  .mes-todos.ativo{ background:var(--gold-soft); color:var(--gold); border-color:var(--gold); }

  .divisor-mes{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 2px 8px;
    color:var(--ink-faint);
  }
  .divisor-mes span{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.1em;
    white-space:nowrap;
    color:#000;
    background:var(--gold);
    padding:3px 9px;
    border-radius:6px;
  }
  .divisor-mes::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--panel-border);
  }

  /* ---------- Cartao de saldo ---------- */
  .saldo-card{
    background:var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:26px 26px 22px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .saldo-card::before{
    content:"";
    position:absolute;
    left:0; right:0; top:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.7;
  }
  .saldo-top{ display:flex; align-items:baseline; justify-content:space-between; }
  .saldo-label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .saldo-selo{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:0.78rem;
    color:var(--gold);
    opacity:0.9;
  }
  .saldo-valor{
    font-family:'IBM Plex Mono', monospace;
    font-size:2.6rem;
    font-weight:600;
    line-height:1;
    transition:color 0.4s ease;
    color:var(--ink);
  }
  .saldo-valor.negativo{ color:var(--despesa); }
  .saldo-valor.positivo{ color:var(--receita); }

  .barra-equilibrio{
    margin-top:18px;
    height:8px;
    border-radius:5px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
    display:flex;
  }
  .barra-equilibrio .seg{ height:100%; transition: width 0.7s cubic-bezier(.4,0,.2,1); }
  .barra-equilibrio .seg.receita-seg{ background:linear-gradient(90deg, #2fbf85, var(--receita)); box-shadow:0 0 12px rgba(79,227,166,0.5); }
  .barra-equilibrio .seg.despesa-seg{ background:linear-gradient(90deg, var(--despesa), #ff9c9c); box-shadow:0 0 12px rgba(255,122,122,0.5); }

  .resumo-linha{
    display:flex;
    gap:16px;
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
  }
  .resumo-item{flex:1; display:flex; align-items:center; gap:7px;}
  .ponto{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .ponto.receita{background:var(--receita); box-shadow:0 0 6px var(--receita);}
  .ponto.despesa{background:var(--despesa); box-shadow:0 0 6px var(--despesa);}
  .resumo-item .k{color:var(--ink-faint); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em;}
  .resumo-item .v{color:var(--ink); font-weight:600; margin-left:auto;}

  /* ---------- Formulario ---------- */
  form{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tipo-toggle{
    display:flex;
    border:1px solid var(--panel-border);
    border-radius:9px;
    overflow:hidden;
    flex-shrink:0;
    background:var(--panel);
  }
  .tipo-toggle button{
    border:none; background:transparent;
    padding:0 15px;
    font-family:'Inter', sans-serif;
    font-weight:600; font-size:0.82rem;
    cursor:pointer;
    color:var(--ink-soft);
    transition: all 0.18s ease;
  }
  .tipo-toggle button:hover{color:var(--ink);}
  .tipo-toggle button.ativo{color:#06170f;}
  .tipo-toggle button[data-tipo="receita"].ativo{background:var(--receita);}
  .tipo-toggle button[data-tipo="despesa"].ativo{background:var(--despesa); color:#2a0a0a;}

  input[type="text"], input[type="number"]{
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    border:1px solid var(--panel-border);
    border-radius:9px;
    padding:10px 13px;
    background:var(--panel);
    color:var(--ink);
    transition: box-shadow 0.15s ease;
  }
  input::placeholder{ color:var(--ink-faint); }
  .valor-wrap{position:relative; flex-shrink:0;}
  .valor-wrap::before{
    content:"R$";
    position:absolute;
    left:12px; top:50%; transform:translateY(-50%);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    color:var(--ink-faint);
    pointer-events:none;
  }
  #valorInput{padding-left:34px; width:130px;}
  input[type="text"]{flex:1 1 160px; min-width:120px;}
  input:focus{outline:none; box-shadow:0 0 0 3px var(--gold-soft); border-color:var(--gold);}

  button.add{
    background:linear-gradient(135deg, var(--receita), #2fbf85);
    color:#06170f;
    border:none;
    border-radius:9px;
    padding:10px 20px;
    font-family:'Inter', sans-serif;
    font-weight:700; font-size:0.9rem;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 6px 18px rgba(79,227,166,0.28);
    transition: transform 0.08s ease, box-shadow 0.15s ease;
  }
  button.add:hover{ box-shadow:0 8px 22px rgba(79,227,166,0.4); }
  button.add:active{ transform:scale(0.96); }

  /* ---------- Filtros e busca ---------- */
  .controles{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .filtros{display:flex; gap:4px;}
  .filtros button{
    background:none; border:none;
    font-family:'Inter', sans-serif;
    font-size:0.8rem; font-weight:600;
    color:var(--ink-soft);
    padding:5px 10px;
    border-radius:7px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .filtros button.ativo{background:var(--panel); color:var(--gold); border:1px solid var(--panel-border);}
  .filtros button:not(.ativo):hover{color:var(--ink);}
  .busca{
    font-family:'Inter', sans-serif;
    font-size:0.82rem;
    border:none;
    border-bottom:1px solid var(--panel-border);
    background:transparent;
    padding:5px 4px;
    color:var(--ink);
    width:140px;
    transition:border-color 0.15s ease;
  }
  .busca::placeholder{ color:var(--ink-faint); }
  .busca:focus{outline:none; border-color:var(--gold);}

  /* ---------- Lista ---------- */
  .lista{list-style:none; margin:0; padding:0;}
  .lancamento{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:13px 4px;
    border-bottom:1px solid var(--panel-border);
    overflow:hidden;
    transition: background 0.5s ease;
  }
  .lancamento.novo{ animation: entrarLinha 0.45s ease; background:var(--gold-soft); }
  .lancamento.saindo{ animation: sairLinha 0.28s ease forwards; }
  @keyframes entrarLinha{ from{ opacity:0; transform:translateX(-14px); } to{ opacity:1; transform:translateX(0); } }
  @keyframes sairLinha{
    from{ opacity:1; max-height:60px; padding-top:13px; padding-bottom:13px; }
    to{ opacity:0; max-height:0; padding-top:0; padding-bottom:0; margin:0; border:none; }
  }

  .lancamento .esq{display:flex; align-items:center; gap:11px; min-width:0;}
  .marcador{
    width:30px; height:30px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:700; font-size:0.95rem;
  }
  .marcador.receita{background:var(--receita-bg); color:var(--receita);}
  .marcador.despesa{background:var(--despesa-bg); color:var(--despesa);}

  .info-lancamento{min-width:0;}
  .nome{
    font-size:0.95rem; font-weight:500;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    display:block;
    color:var(--ink);
  }
  .nome-input{
    font-family:'Inter', sans-serif;
    font-size:0.95rem;
    border:1px solid var(--gold);
    border-radius:6px;
    padding:3px 7px;
    background:rgba(255,255,255,0.06);
    color:var(--ink);
    width:100%;
  }
  .quando{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--ink-faint); }

  .direita{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .valor{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:0.95rem; }
  .valor-input{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.9rem; width:80px;
    border:1px solid var(--gold);
    border-radius:6px; padding:3px 6px;
    background:rgba(255,255,255,0.06);
    color:var(--ink);
  }
  .valor.receita{color:var(--receita);}
  .valor.despesa{color:var(--despesa);}

  .acoes{display:flex; gap:2px;}
  .acao-btn{
    background:none; border:none; cursor:pointer;
    color:var(--ink-faint); font-size:0.95rem; line-height:1;
    padding:5px 6px; border-radius:6px;
    transition: all 0.15s ease;
  }
  .acao-btn:hover{background:rgba(255,255,255,0.08); color:var(--ink);}
  .acao-btn.excluir:hover{color:var(--despesa); background:var(--despesa-bg);}
  .acao-btn.confirmar:hover{color:var(--receita); background:var(--receita-bg);}

  .vazio{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .vazio svg{margin-bottom:12px; opacity:0.7;}
  .vazio .titulo-vazio{
    font-family:'Fraunces', serif; font-style:italic;
    font-size:1.25rem; color:var(--ink); margin-bottom:6px;
  }
  .vazio .sub-vazio{font-size:0.85rem;}

  .loading{text-align:center; color:var(--ink-soft); padding:30px; font-size:0.85rem;}

  @media (max-width:480px){
    header h1{font-size:1.7rem;}
    .saldo-valor{font-size:2.1rem;}
    .quando{display:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .nebulosa, .camada-estrela, .estrela-cadente{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="cosmos" id="cosmos">
  <div class="nebulosa n1"></div>
  <div class="nebulosa n2"></div>
  <div class="nebulosa n3"></div>
  <div class="estrelas">
    <div class="camada-estrela perto" id="estrelasPerto"></div>
    <div class="camada-estrela meio" id="estrelasMeio"></div>
    <div class="camada-estrela longe" id="estrelasLonge"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>Livro<span class="pingo">-</span>Caixa</h1>
    <div class="data" id="dataAtual"></div>
  </header>

  <div class="mes-nav">
    <button type="button" class="mes-seta" id="mesAnterior" title="Mes anterior">&#8249;</button>
    <button type="button" class="mes-label" id="mesLabel"></button>
    <button type="button" class="mes-seta" id="mesProximo" title="Proximo mes">&#8250;</button>
    <button type="button" class="mes-todos" id="mesTodos">Ver tudo</button>
  </div>

  <div class="saldo-card">
    <div class="saldo-top">
      <div>
        <div class="saldo-label">Saldo atual</div>
        <div class="saldo-valor" id="saldoValor">R$ 0,00</div>
      </div>
      <div class="saldo-selo" id="saldoSelo"></div>
    </div>

    <div class="barra-equilibrio">
      <div class="seg receita-seg" id="segReceita" style="width:50%"></div>
      <div class="seg despesa-seg" id="segDespesa" style="width:50%"></div>
    </div>

    <div class="resumo-linha">
      <div class="resumo-item">
        <span class="ponto receita"></span>
        <span class="k">Receitas</span>
        <span class="v" id="totalReceitas">R$ 0,00</span>
      </div>
      <div class="resumo-item">
        <span class="ponto despesa"></span>
        <span class="k">Despesas</span>
        <span class="v" id="totalDespesas">R$ 0,00</span>
      </div>
    </div>
  </div>

  <form id="formLancamento">
    <div class="tipo-toggle">
      <button type="button" data-tipo="receita" class="ativo">Receita</button>
      <button type="button" data-tipo="despesa">Despesa</button>
    </div>
    <input type="text" id="nomeInput" placeholder="Descricao (ex: salario, aluguel)" required>
    <div class="valor-wrap">
      <input type="number" id="valorInput" placeholder="0,00" step="0.01" min="0" required>
    </div>
    <button type="submit" class="add">Adicionar</button>
  </form>

  <div class="controles">
    <div class="filtros">
      <button data-filtro="todos" class="ativo">Todos</button>
      <button data-filtro="receita">Receitas</button>
      <button data-filtro="despesa">Despesas</button>
    </div>
    <input type="text" class="busca" id="buscaInput" placeholder="Buscar...">
  </div>

  <ul class="lista" id="listaLancamentos"></ul>
  <div class="loading" id="loadingMsg">Carregando...</div>
</div>

<script>
/* ---------- Fundo espacial ---------- */
function gerarEstrelas(elId, quantidade, tamanho){
  const el = document.getElementById(elId);
  let sombras = [];
  for(let i=0;i<quantidade;i++){
    const x = Math.random()*100;
    const y = Math.random()*140;
    sombras.push(`${x}vw ${y}vh 0 ${tamanho}px #fff`);
  }
  el.style.boxShadow = sombras.join(',');
  el.style.width = tamanho+'px';
  el.style.height = tamanho+'px';
  el.style.borderRadius = '50%';
  el.style.background = 'transparent';
}
gerarEstrelas('estrelasPerto', 60, 1.6);
gerarEstrelas('estrelasMeio', 90, 1.1);
gerarEstrelas('estrelasLonge', 130, 0.7);

function lancarEstrelaCadente(){
  const cosmos = document.getElementById('cosmos');
  const el = document.createElement('div');
  el.className = 'estrela-cadente ativa';
  el.style.top = (Math.random()*40)+'vh';
  el.style.left = (30+Math.random()*50)+'vw';
  cosmos.appendChild(el);
  setTimeout(() => el.remove(), 1200);
  setTimeout(lancarEstrelaCadente, 6000 + Math.random()*9000);
}
setTimeout(lancarEstrelaCadente, 3000);

/* ---------- Aplicacao ---------- */
let tipoAtual = 'receita';
let lancamentos = [];
let filtroAtual = 'todos';
let termoBusca = '';
let ultimoSaldo = 0;
let idNovo = null;
let modoTodosMeses = false;
const hoje = new Date();
let mesSelecionado = { ano: hoje.getFullYear(), mes: hoje.getMonth() };

const btnReceita = document.querySelector('[data-tipo="receita"]');
const btnDespesa = document.querySelector('[data-tipo="despesa"]');
const form = document.getElementById('formLancamento');
const nomeInput = document.getElementById('nomeInput');
const valorInput = document.getElementById('valorInput');
const lista = document.getElementById('listaLancamentos');
const loadingMsg = document.getElementById('loadingMsg');
const buscaInput = document.getElementById('buscaInput');
const saldoSelo = document.getElementById('saldoSelo');

document.getElementById('dataAtual').textContent = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });

/* ---------- Navegacao por mes ---------- */
const mesLabelEl = document.getElementById('mesLabel');
const mesAnteriorBtn = document.getElementById('mesAnterior');
const mesProximoBtn = document.getElementById('mesProximo');
const mesTodosBtn = document.getElementById('mesTodos');

function nomeMes(ano, mes){
  const texto = new Date(ano, mes, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function chaveMes(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + d.getMonth();
}

function atualizarNavMes(){
  mesTodosBtn.classList.toggle('ativo', modoTodosMeses);
  mesAnteriorBtn.disabled = modoTodosMeses;
  mesProximoBtn.disabled = modoTodosMeses;
  mesLabelEl.textContent = modoTodosMeses ? 'Todos os meses' : nomeMes(mesSelecionado.ano, mesSelecionado.mes);
}

mesAnteriorBtn.addEventListener('click', () => {
  mesSelecionado.mes--;
  if(mesSelecionado.mes < 0){ mesSelecionado.mes = 11; mesSelecionado.ano--; }
  atualizarNavMes();
  renderizar(true);
});

mesProximoBtn.addEventListener('click', () => {
  mesSelecionado.mes++;
  if(mesSelecionado.mes > 11){ mesSelecionado.mes = 0; mesSelecionado.ano++; }
  atualizarNavMes();
  renderizar(true);
});

mesTodosBtn.addEventListener('click', () => {
  modoTodosMeses = !modoTodosMeses;
  atualizarNavMes();
  renderizar(true);
});

atualizarNavMes();

btnReceita.addEventListener('click', () => setTipo('receita'));
btnDespesa.addEventListener('click', () => setTipo('despesa'));

document.querySelectorAll('.filtros button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filtros button').forEach(b => b.classList.remove('ativo'));
    btn.classList.add('ativo');
    filtroAtual = btn.dataset.filtro;
    renderizar(true);
  });
});

buscaInput.addEventListener('input', () => {
  termoBusca = buscaInput.value.trim().toLowerCase();
  renderizar(true);
});

function setTipo(t){
  tipoAtual = t;
  btnReceita.classList.toggle('ativo', t === 'receita');
  btnDespesa.classList.toggle('ativo', t === 'despesa');
}

function formatarMoeda(valor){
  return valor.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}

function formatarData(ts){
  return new Date(ts).toLocaleDateString('pt-BR', { day:'2-digit', month:'short' });
}

async function salvar(){
  try{
    localStorage.setItem('livro-caixa-lancamentos', JSON.stringify(lancamentos));
  }catch(e){
    console.error('Erro ao salvar:', e);
  }
}

async function carregar(){
  try{
    const dados = localStorage.getItem('livro-caixa-lancamentos');
    lancamentos = dados ? JSON.parse(dados) : [];
  }catch(e){
    lancamentos = [];
  }
  loadingMsg.style.display = 'none';
  renderizar(true);
}

function animarNumero(el, de, para){
  const duracao = 500;
  const inicio = performance.now();
  function passo(agora){
    const progresso = Math.min((agora - inicio) / duracao, 1);
    const facilitado = 1 - Math.pow(1 - progresso, 3);
    const valorAtual = de + (para - de) * facilitado;
    el.textContent = formatarMoeda(valorAtual);
    if(progresso < 1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}

function itensDoMes(){
  return lancamentos.filter(l => {
    if(!modoTodosMeses){
      const chave = mesSelecionado.ano + '-' + mesSelecionado.mes;
      if(chaveMes(l.criadoEm || Date.now()) !== chave) return false;
    }
    return true;
  });
}

function itensFiltrados(){
  return itensDoMes().filter(l => {
    if(filtroAtual !== 'todos' && l.tipo !== filtroAtual) return false;
    if(termoBusca && !l.nome.toLowerCase().includes(termoBusca)) return false;
    return true;
  }).sort((a,b) => (b.criadoEm||0) - (a.criadoEm||0));
}

function criarLinhaLancamento(l){
  const li = document.createElement('li');
  li.className = 'lancamento';
  li.dataset.id = l.id;
  if(l.id === idNovo) li.classList.add('novo');
  li.innerHTML = `
    <div class="esq">
      <span class="marcador ${l.tipo}">${l.tipo === 'despesa' ? '&minus;' : '+'}</span>
      <div class="info-lancamento">
        <span class="nome">${escapeHtml(l.nome)}</span>
        <span class="quando">${formatarData(l.criadoEm || Date.now())}</span>
      </div>
    </div>
    <div class="direita">
      <span class="valor ${l.tipo}">${l.tipo === 'despesa' ? '-' : '+'} ${formatarMoeda(l.valor)}</span>
      <div class="acoes">
        <button class="acao-btn editar" data-id="${l.id}" title="Editar">&#9998;</button>
        <button class="acao-btn excluir" data-id="${l.id}" title="Excluir">&#10005;</button>
      </div>
    </div>
  `;
  return li;
}

function renderizar(semAnimarNumeros){
  const itens = itensFiltrados();
  lista.innerHTML = '';

  if(lancamentos.length === 0){
    lista.innerHTML = `<div class="vazio">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="24" stroke="#4A5380" stroke-width="2" stroke-dasharray="4 5"/>
        <path d="M18 27L23.5 32.5L35 20" stroke="#F4C567" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
      </svg>
      <div class="titulo-vazio">O livro esta em branco</div>
      <div class="sub-vazio">Adicione sua primeira receita ou despesa acima.</div>
    </div>`;
  } else if(itens.length === 0){
    lista.innerHTML = `<div class="vazio">
      <div class="titulo-vazio">Nada por aqui</div>
      <div class="sub-vazio">${modoTodosMeses ? 'Nenhum lancamento corresponde ao filtro ou busca.' : 'Nenhum lancamento em ' + nomeMes(mesSelecionado.ano, mesSelecionado.mes).toLowerCase() + '.'}</div>
    </div>`;
  } else if(modoTodosMeses){
    let chaveAnterior = null;
    itens.forEach(l => {
      const chave = chaveMes(l.criadoEm || Date.now());
      if(chave !== chaveAnterior){
        const d = new Date(l.criadoEm || Date.now());
        const divisor = document.createElement('li');
        divisor.className = 'divisor-mes';
        divisor.innerHTML = `<span>${nomeMes(d.getFullYear(), d.getMonth())}</span>`;
        lista.appendChild(divisor);
        chaveAnterior = chave;
      }
      lista.appendChild(criarLinhaLancamento(l));
    });

    lista.querySelectorAll('.excluir').forEach(btn => {
      btn.addEventListener('click', () => excluir(btn.dataset.id));
    });
    lista.querySelectorAll('.editar').forEach(btn => {
      btn.addEventListener('click', () => iniciarEdicao(btn.dataset.id));
    });
  } else {
    itens.forEach(l => lista.appendChild(criarLinhaLancamento(l)));

    lista.querySelectorAll('.excluir').forEach(btn => {
      btn.addEventListener('click', () => excluir(btn.dataset.id));
    });
    lista.querySelectorAll('.editar').forEach(btn => {
      btn.addEventListener('click', () => iniciarEdicao(btn.dataset.id));
    });
  }

  idNovo = null;

  const totaisBase = itensDoMes();
  const totalReceitas = totaisBase.filter(l => l.tipo === 'receita').reduce((s,l) => s + l.valor, 0);
  const totalDespesas = totaisBase.filter(l => l.tipo === 'despesa').reduce((s,l) => s + l.valor, 0);
  const saldo = totalReceitas - totalDespesas;
  const total = totalReceitas + totalDespesas;

  const elReceitas = document.getElementById('totalReceitas');
  const elDespesas = document.getElementById('totalDespesas');
  const elSaldo = document.getElementById('saldoValor');

  if(semAnimarNumeros){
    elReceitas.textContent = formatarMoeda(totalReceitas);
    elDespesas.textContent = formatarMoeda(totalDespesas);
    elSaldo.textContent = formatarMoeda(saldo);
  } else {
    const receitasAtual = parseFloat(elReceitas.textContent.replace(/[^\d,-]/g,'').replace(',','.')) || 0;
    const despesasAtual = parseFloat(elDespesas.textContent.replace(/[^\d,-]/g,'').replace(',','.')) || 0;
    animarNumero(elReceitas, receitasAtual, totalReceitas);
    animarNumero(elDespesas, despesasAtual, totalDespesas);
    animarNumero(elSaldo, ultimoSaldo, saldo);
  }
  ultimoSaldo = saldo;

  elSaldo.classList.remove('positivo','negativo');
  elSaldo.classList.add(saldo >= 0 ? 'positivo' : 'negativo');

  saldoSelo.textContent = saldo > 0 ? 'no azul' : (saldo < 0 ? 'no vermelho' : 'zerado');

  const pctReceita = total > 0 ? (totalReceitas/total*100) : 50;
  const pctDespesa = total > 0 ? (totalDespesas/total*100) : 50;
  document.getElementById('segReceita').style.width = pctReceita + '%';
  document.getElementById('segDespesa').style.width = pctDespesa + '%';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function excluir(id){
  const li = lista.querySelector(`[data-id="${id}"]`);
  if(li){
    li.classList.add('saindo');
    await new Promise(r => setTimeout(r, 260));
  }
  lancamentos = lancamentos.filter(l => l.id !== id);
  renderizar();
  await salvar();
}

function iniciarEdicao(id){
  const l = lancamentos.find(x => x.id === id);
  if(!l) return;
  const li = lista.querySelector(`[data-id="${id}"]`);
  if(!li) return;

  const nomeSpan = li.querySelector('.nome');
  const valorSpan = li.querySelector('.valor');
  const acoesDiv = li.querySelector('.acoes');

  const nomeIn = document.createElement('input');
  nomeIn.className = 'nome-input';
  nomeIn.value = l.nome;
  nomeSpan.replaceWith(nomeIn);

  const valorIn = document.createElement('input');
  valorIn.className = 'valor-input';
  valorIn.type = 'number';
  valorIn.step = '0.01';
  valorIn.value = l.valor;
  valorSpan.replaceWith(valorIn);

  acoesDiv.innerHTML = `<button class="acao-btn confirmar" title="Salvar">&#10003;</button>`;
  acoesDiv.querySelector('.confirmar').addEventListener('click', async () => {
    const novoNome = nomeIn.value.trim();
    const novoValor = parseFloat(valorIn.value);
    if(novoNome && !isNaN(novoValor) && novoValor > 0){
      l.nome = novoNome;
      l.valor = novoValor;
      await salvar();
    }
    renderizar();
  });

  nomeIn.focus();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const nome = nomeInput.value.trim();
  const valor = parseFloat(valorInput.value);
  if(!nome || isNaN(valor) || valor <= 0) return;

  const novo = {
    id: Date.now().toString(),
    nome,
    valor,
    tipo: tipoAtual,
    criadoEm: Date.now()
  };
  lancamentos.push(novo);
  idNovo = novo.id;

  nomeInput.value = '';
  valorInput.value = '';
  nomeInput.focus();

  renderizar();
  await salvar();
});

carregar();
</script>
</body>
</html>
